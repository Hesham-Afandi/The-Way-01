<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background subtle soft gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F8FC" />
      <stop offset="100%" stop-color="#E8F1F9" />
    </radialGradient>

    <!-- W Left Arm Gradient (Electric Blue with top highlight to rich blue) -->
    <linearGradient id="wLeftArm" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#00A2F8" />
      <stop offset="35%" stop-color="#0080DE" />
      <stop offset="100%" stop-color="#004D99" />
    </linearGradient>

    <!-- W Center & Right Deep Royal/Navy Gradient -->
    <linearGradient id="wMainBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070CE" />
      <stop offset="40%" stop-color="#044E9B" />
      <stop offset="100%" stop-color="#012C63" />
    </linearGradient>

    <!-- THE 3D Sphere Radial Gradient -->
    <radialGradient id="theSphere" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="25%" stop-color="#007BDB" />
      <stop offset="65%" stop-color="#00458F" />
      <stop offset="100%" stop-color="#012454" />
    </radialGradient>

    <!-- Swoosh Arc Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077D6" />
      <stop offset="45%" stop-color="#0088E8" />
      <stop offset="85%" stop-color="#149DF6" />
      <stop offset="100%" stop-color="#0072CE" />
    </linearGradient>

    <!-- Arrow Upper Facet (Bright Sky Blue) -->
    <linearGradient id="arrowTopFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007FDE" />
      <stop offset="100%" stop-color="#26B4FF" />
    </linearGradient>

    <!-- Arrow Lower Facet (Deep Cobalt Shade) -->
    <linearGradient id="arrowBottomFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0058A8" />
      <stop offset="100%" stop-color="#013673" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter for 3D elements -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#002D62" flood-opacity="0.18" />
    </filter>

    <filter id="arrowShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#002450" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="650" fill="url(#bgGrad)" rx="16" />

  <g transform="translate(40, 20)">
    <!-- 1. MAIN 'W' LETTER -->
    <!-- Left Column (Slanted outer arm) -->
    <polygon points="175,170 258,170 318,440 242,440" fill="url(#wLeftArm)" filter="url(#softShadow)" />

    <!-- Center V-Bar -->
    <polygon points="325,170 405,170 445,345 390,440 338,440" fill="url(#wMainBody)" filter="url(#softShadow)" />

    <!-- Right Column (Slanted outer arm) -->
    <polygon points="405,170 560,170 485,440 400,440" fill="url(#wMainBody)" filter="url(#softShadow)" />

    <!-- 2. "THE" 3D SPHERE BADGE -->
    <g filter="url(#softShadow)">
      <circle cx="140" cy="275" r="48" fill="url(#theSphere)" />
      <!-- Subtle top-left glare -->
      <ellipse cx="126" cy="254" rx="16" ry="10" fill="#FFFFFF" opacity="0.35" transform="rotate(-25 126 254)" />
      <!-- Text 'THE' -->
      <text x="140" y="286" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">THE</text>
    </g>

    <!-- 3. SWEEPING SWOOSH & 3D ARROW -->
    <!-- Curved Crescent sweeping from THE under the W -->
    <path d="M 80,295 C 85,365 185,395 305,330 C 400,278 495,175 605,80 L 595,70 C 480,170 385,270 295,320 C 185,375 98,350 92,295 Z" fill="url(#swooshGrad)" filter="url(#softShadow)" />

    <!-- Straight 3D Launch Vector / Shaft -->
    <path d="M 295,320 L 605,80 L 600,72 L 290,312 Z" fill="#0060BA" />

    <!-- 3D Arrowhead at top right -->
    <g filter="url(#arrowShadow)">
      <!-- Top / Upper Wing -->
      <polygon points="655,30 575,70 605,115" fill="url(#arrowTopFacet)" />
      <!-- Bottom / Shaded Facet -->
      <polygon points="655,30 605,115 595,85" fill="url(#arrowBottomFacet)" />
    </g>

    <!-- 4. OFFICIAL TYPOGRAPHY -->
    <text x="365" y="482" font-family="'Plus Jakarta Sans', 'Cairo', 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="900" fill="#001F45" text-anchor="middle" letter-spacing="0.2">The Way Training Center</text>
    <text x="365" y="514" font-family="'Plus Jakarta Sans', 'Cairo', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#002B5E" text-anchor="middle" letter-spacing="1.2">Your Way To Success</text>
  </g>
</svg>
